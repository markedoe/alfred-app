# Intégration : à chaque envoi et chaque demande de fusion. Aucun secret ici (les contributions extérieures n'en
# reçoivent jamais) ; l'app est fabriquée sans la configuration de la maison et testée sur la maison de démonstration.
name: Intégration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# une exécution remplacée par un envoi plus récent s'annule, sur main aussi (22.10) : TestFlight ne fabrique que le
# dernier commit vérifié, et « changements.py » compare toujours à la dernière Intégration RÉUSSIE (jamais au commit
# précédent). Une étiquette v* doit donc viser un commit dont l'Intégration a réussi ; sinon, lancer « Intégration » à
# la main sur l'étiquette.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  changements:
    name: L'app a-t-elle changé ?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      app: ${{ steps.app.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # sur un envoi sur main : la comparaison se fait avec la dernière Intégration RÉUSSIE ; sans base certaine (demande
      # de fusion, lancement à la main, étiquette, API muette), tout tourne
      - name: Depuis la dernière Intégration réussie
        id: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/outils/changements.py ci

  style:
    name: Style (swift-format) et tailles de texte
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # la même version que celle du poste de développement (crochet avant chaque commit) : mêmes refus que le Mac,
    # vérifié le 22.10 sur deux commits refusés
    container: swift:6.4.1-noble@sha256:19cbe56bdaec1918f7cf5fdeba42b9bd55bdd8a6149c9990d0e0e3a89a127d63
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Style (swift-format)
        run: |
          swift-format --version
          swift-format lint --strict --recursive \
            App AppTests AppUITests Paquets/AlfredKit/Sources Paquets/AlfredKit/Tests Paquets/AlfredKit/Package.swift
      - name: Aucune taille de texte figée
        # les textes suivent la taille choisie (Dynamic Type) : une taille ne s'écrit qu'à partir d'une mesure
        # (@ScaledMetric) ou de la géométrie d'un dessin, jamais en chiffres
        run: |
          if grep -rnE '\.system\(size: *[0-9]' App; then
            echo "::error::taille de texte figée (utiliser un style de texte ou @ScaledMetric)"; exit 1
          fi

  secrets:
    name: Aucun secret (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (binaire vérifié par son empreinte)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  outils:
    name: Outils de la CI (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests (API d'App Store Connect simulée, aucun secret ; icône à jour)
        run: python3 -m unittest discover -s scripts/outils -p 'test_*.py' -v

  icone:
    name: Icône (compilée et rendue par les outils d'Apple)
    needs: changements
    if: needs.changements.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compilation (actool, comme Xcode)
        run: |
          mkdir -p "$RUNNER_TEMP/actool"
          xcrun actool App/Ressources/AppIcon.icon --compile "$RUNNER_TEMP/actool" --platform iphoneos \
            --minimum-deployment-target 26.0 --target-device iphone --target-device ipad --app-icon AppIcon \
            --output-partial-info-plist "$RUNNER_TEMP/actool/partiel.plist" \
            --errors --warnings --notices --output-format human-readable-text
          plutil -p "$RUNNER_TEMP/actool/partiel.plist"
          grep -q AppIcon "$RUNNER_TEMP/actool/partiel.plist" || { echo "::error::icône absente du résultat"; exit 1; }
      - name: Rendu des six apparences (ictool, l'outil d'Icon Composer)
        run: |
          ictool="$DEVELOPER_DIR/../Applications/Icon Composer.app/Contents/Executables/ictool"
          if [[ ! -x "$ictool" ]]; then
            echo "::error::ictool introuvable"; find "$DEVELOPER_DIR/.." -maxdepth 6 -name 'ictool*' || true; exit 1
          fi
          "$ictool" --version
          mkdir -p "$RUNNER_TEMP/icone"
          # syntaxe de « ictool --help » (Xcode 26.6) ; le masque d'iOS est déjà appliqué
          for apparence in Default Dark ClearLight ClearDark TintedLight TintedDark; do
            "$ictool" App/Ressources/AppIcon.icon --export-image --output-file "$RUNNER_TEMP/icone/$apparence.png" \
              --platform iOS --rendition "$apparence" --width 1024 --height 1024 --scale 1
            [[ -s "$RUNNER_TEMP/icone/$apparence.png" ]] || { echo "::error::rendu $apparence absent"; exit 1; }
          done
          ls -l "$RUNNER_TEMP/icone"
      - name: Rendus
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icone
          path: ${{ runner.temp }}/icone
          retention-days: 14
          if-no-files-found: ignore

  noyau-linux:
    name: AlfredKit (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.2.4-noble@sha256:eccc7a97f9b9881d9659e2e788081fd7675f86d39793b51200bfb178398b3784
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests
        run: swift test --package-path Paquets/AlfredKit --parallel

  # trois Mac en parallèle (22.10 ; avant : à la suite sur un seul, ≈ 22 min) ; « fail-fast: false » : un simulateur lent
  # sur l'iPad n'annule pas les tests de l'iPhone. Chaque série se relance seule.
  ios:
    name: App iOS — ${{ matrix.titre }}
    needs: [changements, style]
    if: needs.changements.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: iphone
            titre: iPhone (fabrication, tests, accessibilité)
            simulateur: iphone
            tests: ""
            largeur: ""
            resultats: Resultats
          - nom: ipad
            titre: iPad, disposition large
            simulateur: ipad
            tests: AlfredUITests/ParcoursUITests/testDispositionLarge
            largeur: ""
            resultats: ResultatsIPad
          # 390 pt : le plus étroit des iPhone visés (iPhone 12 à 14, 16e) ; le test échoue sur un écran plus large
          - nom: etroit
            titre: iPhone le plus étroit (en-tête)
            simulateur: etroit
            tests: AlfredUITests/ParcoursUITests/testEnTete
            largeur: "390"
            resultats: ResultatsEtroit
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Outils
        run: |
          xcodebuild -version
          curl -fsSLo xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: AlfredKit (macOS)
        if: matrix.nom == 'iphone'
        run: swift test --package-path Paquets/AlfredKit --parallel
      - name: Projet (XcodeGen)
        run: scripts/generer.sh
      - name: Simulateur
        id: simulateur
        # en deux temps : dans « echo », un échec du script passerait inaperçu (l'étape réussirait, sans simulateur)
        env:
          GENRE: ${{ matrix.simulateur }}
        run: |
          udid=$(scripts/simulateur.sh "$GENRE")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Fabrication et tests
        env:
          UDID: ${{ steps.simulateur.outputs.udid }}
          TESTS: ${{ matrix.tests }}
          LARGEUR: ${{ matrix.largeur }}
          RESULTATS: ${{ matrix.resultats }}
          NOM: ${{ matrix.nom }}
        run: |
          set -o pipefail
          seulement=()
          if [[ -n "$TESTS" ]]; then seulement=("-only-testing:$TESTS"); fi
          # la largeur maximale fait échouer le test de l'en-tête sur un écran plus large que l'iPhone visé
          if [[ -n "$LARGEUR" ]]; then export TEST_RUNNER_ALFRED_LARGEUR_MAX="$LARGEUR"; fi
          xcodebuild test -quiet \
            -project Alfred.xcodeproj -scheme Alfred \
            -destination "id=$UDID" \
            "${seulement[@]}" \
            -resultBundlePath "$RUNNER_TEMP/$RESULTATS.xcresult" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild-$NOM.log"
      # « !cancelled() » plutôt que « always() » : après un échec, la suite tourne quand même ; après une annulation
      # (un envoi plus récent), plus rien ne tourne (« always() » continuerait jusqu'à 10 min sur le Mac)
      - name: Résumé des tests (échecs, captures)
        if: ${{ !cancelled() }}
        env:
          RESULTATS: ${{ matrix.resultats }}
        run: |
          R="$RUNNER_TEMP/$RESULTATS.xcresult"
          mkdir -p "$RUNNER_TEMP/captures/$RESULTATS"
          [ -d "$R" ] || { echo "$RESULTATS : pas de résultats"; exit 0; }
          if xcrun xcresulttool get test-results summary --path "$R" --compact > "$RUNNER_TEMP/resume.json"; then
            {
              echo "$RESULTATS"
              echo '```'
              jq -r '"\(.result) : \(.passedTests) réussis, \(.failedTests) en échec, \(.skippedTests) ignorés",
                (.testFailures[]? | "✘ \(.testIdentifierString // .testName)", (.failureText | split("\n")[] | "✘   \(.)"))' \
                "$RUNNER_TEMP/resume.json"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            xcrun xcresulttool help get test-results || true
          fi
          xcrun xcresulttool export attachments --path "$R" --output-path "$RUNNER_TEMP/captures/$RESULTATS" \
            || xcrun xcresulttool help export || true
      - name: Captures d'écran
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-ios-${{ matrix.nom }}
          path: ${{ runner.temp }}/captures
          retention-days: 14
          if-no-files-found: ignore
      - name: Résultats (captures d'écran comprises)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultats-ios-${{ matrix.nom }}
          path: |
            ${{ runner.temp }}/${{ matrix.resultats }}.xcresult
            ${{ runner.temp }}/xcodebuild-${{ matrix.nom }}.log
          retention-days: 14
