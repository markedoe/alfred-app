# Fabrication signée et envoi à TestFlight (testeurs internes : la famille). Lancement à la main, ou par une étiquette
# de version (v1.0.0…). Il lit la configuration de la maison (adresse du relais, autorité épinglée, hôte de la page de
# connexion), la clé d'API App Store Connect et l'identité de signature de la CI ; le workflow « Certificats » ne lit
# que la clé. Signature automatique : l'archive est signée par le certificat de développement unique de la CI (secrets
# du dépôt, trousseau temporaire ; sans lui, chaque machine neuve en créerait un), la distribution par Apple (« cloud ») ;
# les profils sont gérés par Xcode. « envoyer » décoché : archive et export signés, sans envoi (vérifier la signature).
# « externe » (coché par défaut, et toujours sur une étiquette) : une fois envoyée, la fabrication part aussi au groupe
# des testeurs externes, après l'examen d'Apple (workflow « Testeurs externes », action « soumettre »).
# Rien ne part sans « Intégration » réussie sur le même commit (job « integration-verte »).
# 22.10 : part AUSSI tout seul quand l'Intégration d'un envoi sur main réussit — seulement depuis
# ce dépôt, sur le commit VÉRIFIÉ (pas la tête de main au lancement), et seulement si ce qui part dans l'app a changé
# depuis la dernière fabrication (`scripts/outils/changements.py testflight` : ni les tests ni la CI seuls ne fabriquent).
# Comme une étiquette, il envoie aussi aux testeurs externes. Le titre de l'exécution nomme le commit fabriqué.
name: TestFlight
run-name: TestFlight ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      envoyer:
        description: "Envoyer à TestFlight (décoché : archive et export signés seulement)"
        type: boolean
        default: true
      externe:
        description: "Aussi aux testeurs externes : groupe externe et examen d'Apple (workflow « Testeurs externes »)"
        type: boolean
        default: true
  push:
    tags: ["v*"]
  workflow_run:
    workflows: ["Intégration"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  integration-verte:
    name: Intégration verte pour ce commit
    # lancé par une Intégration : seulement un ENVOI sur main de CE dépôt, réussi (jamais une demande de fusion, ni une
    # copie du dépôt : ce workflow lit les secrets de signature)
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      fabriquer: ${{ steps.fabriquer.outputs.fabriquer }}
    steps:
      # lancé par une Intégration, « github.sha » est la tête de main au lancement : le commit vérifié est head_sha
      - name: Commit à fabriquer
        id: commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit invalide"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      # rien ne part à TestFlight sans que la CI (« Intégration ») ait réussi sur ce même commit
      - name: Dernière « Intégration » du commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&status=success&per_page=1" \
            --jq '.total_count')
          [[ "$n" =~ ^[0-9]+$ && "$n" -ge 1 ]] \
            || { echo "::error::« Intégration » n'a pas réussi sur ${SHA::7} : TestFlight attend la CI verte"; exit 1; }
          echo "« Intégration » réussie sur ${SHA::7}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # à la main ou par une étiquette : toujours ; lancé par une Intégration : seulement si l'app livrée a changé
      - name: Ce qui part dans l'app a-t-il changé ?
        id: fabriquer
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            python3 scripts/outils/changements.py testflight "$SHA"
          else
            echo "fabriquer=true" >> "$GITHUB_OUTPUT"
          fi

  testflight:
    name: Fabriquer et envoyer
    needs: integration-verte
    if: needs.integration-verte.outputs.fabriquer == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.integration-verte.outputs.sha }}
          persist-credentials: false
      - name: XcodeGen
        run: |
          curl -fsSLo xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Projet, avec la configuration de la maison
        env:
          ALFRED_RELAIS: ${{ secrets.ALFRED_RELAIS }}
          ALFRED_AUTORITE_PEM_B64: ${{ secrets.ALFRED_AUTORITE_PEM_B64 }}
          ALFRED_HA_HOTE: ${{ secrets.ALFRED_HA_HOTE }}
        run: |
          test -n "$ALFRED_RELAIS" || { echo "::error::secret ALFRED_RELAIS absent"; exit 1; }
          scripts/generer.sh
      - name: Clé d'API App Store Connect
        env:
          ASC_CLE_P8_B64: ${{ secrets.ASC_CLE_P8_B64 }}
          ASC_CLE_ID: ${{ secrets.ASC_CLE_ID }}
        run: scripts/cle-asc.sh
      - name: Identité de signature de la CI (trousseau temporaire)
        env:
          SIGNATURE_P12_B64: ${{ secrets.SIGNATURE_P12_B64 }}
          SIGNATURE_P12_MOT_DE_PASSE: ${{ secrets.SIGNATURE_P12_MOT_DE_PASSE }}
        run: scripts/trousseau.sh
      - name: Archive (Release, signature automatique)
        env:
          ASC_CLE_ID: ${{ secrets.ASC_CLE_ID }}
          ASC_EMETTEUR_ID: ${{ secrets.ASC_EMETTEUR_ID }}
          APPLE_EQUIPE_ID: ${{ secrets.APPLE_EQUIPE_ID }}
        run: |
          set -o pipefail
          xcodebuild archive -quiet \
            -project Alfred.xcodeproj -scheme Alfred -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Alfred.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_CLE_ID}.p8" \
            -authenticationKeyID "$ASC_CLE_ID" \
            -authenticationKeyIssuerID "$ASC_EMETTEUR_ID" \
            ALFRED_EQUIPE="$APPLE_EQUIPE_ID" \
            ALFRED_BUILD="${{ github.run_number }}" 2>&1 | tee "$RUNNER_TEMP/archive.log"
      - name: Envoi à TestFlight
        env:
          # sur une étiquette ou lancé par une Intégration, « inputs » est vide : l'envoi a lieu
          ENVOYER: ${{ github.event_name != 'workflow_dispatch' || inputs.envoyer }}
          ASC_CLE_ID: ${{ secrets.ASC_CLE_ID }}
          ASC_EMETTEUR_ID: ${{ secrets.ASC_EMETTEUR_ID }}
          APPLE_EQUIPE_ID: ${{ secrets.APPLE_EQUIPE_ID }}
        run: |
          set -o pipefail
          plutil -create xml1 "$RUNNER_TEMP/export.plist"
          plutil -insert method -string app-store-connect "$RUNNER_TEMP/export.plist"
          if [[ "$ENVOYER" == true ]]; then destination="upload"; else destination="export"; fi
          plutil -insert destination -string "$destination" "$RUNNER_TEMP/export.plist"
          plutil -insert teamID -string "$APPLE_EQUIPE_ID" "$RUNNER_TEMP/export.plist"
          plutil -insert signingStyle -string automatic "$RUNNER_TEMP/export.plist"
          plutil -insert uploadSymbols -bool true "$RUNNER_TEMP/export.plist"
          plutil -insert manageAppVersionAndBuildNumber -bool false "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Alfred.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_CLE_ID}.p8" \
            -authenticationKeyID "$ASC_CLE_ID" \
            -authenticationKeyIssuerID "$ASC_EMETTEUR_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"
      - name: Effacer la clé et le trousseau
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/signature.p12"
          if [[ -f "$RUNNER_TEMP/signature.keychain-db" ]]; then security delete-keychain "$RUNNER_TEMP/signature.keychain-db"; fi

  externe:
    name: Testeurs externes
    needs: testflight
    # sur une étiquette ou lancé par une Intégration, « inputs » est vide : l'envoi aux testeurs externes a lieu
    if: github.event_name != 'workflow_dispatch' || (inputs.envoyer && inputs.externe)
    uses: ./.github/workflows/testeurs-externes.yml
    with:
      action: soumettre
      fabrication: "${{ github.run_number }}"
    secrets:
      ASC_CLE_P8_B64: ${{ secrets.ASC_CLE_P8_B64 }}
      ASC_CLE_ID: ${{ secrets.ASC_CLE_ID }}
      ASC_EMETTEUR_ID: ${{ secrets.ASC_EMETTEUR_ID }}
      ASC_CONTACT_REVUE: ${{ secrets.ASC_CONTACT_REVUE }}
